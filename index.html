<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Password Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

</head>
<body>
    <div class="container d-flex justify-contennt-center min-vh-100 align-items-center text-lg ">
        <div class="d-flex flex-column">
            <h1>Password Generator </h1>
            <div class="d-flex flex-column gap-2 mt-2">
                <label for="passwordLength" class="text-uppercase fw-bold">Panjang Password</label>
                <input type="number" class="from-control from-control-lg" id="passwordLength">
                <label for="password" class="text-uppercase fw-bold">Password</label>
                <input class="from-control from-control-lg" id="password" disabled>
                <button class="btn-solid theme-inverse text-uppercase fw-bold btn-lg mt-2" onclick="getPassword()">generate password</button>
                <a class="btn-solid theme-primary text-uppercase fw-bold btn-lg mt-2" onclick="savePassword()" id="saveButton"> save password</a>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
